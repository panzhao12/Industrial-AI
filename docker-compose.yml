name: industrial-ai-copilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: industrial-ai-postgres
    environment:
      POSTGRES_DB: industrial_ai
      POSTGRES_USER: industrial_ai
      POSTGRES_PASSWORD: industrial_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industrial_ai -d industrial_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
